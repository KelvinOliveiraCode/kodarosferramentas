name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências de teste
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Rodar smoke test
        working-directory: tests
        run: node smoke.js
